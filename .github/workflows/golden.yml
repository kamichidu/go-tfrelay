name: Golden Set

on:
  pull_request:
    branches: [main, fix/terraform-1.17-planfile-compat]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  golden:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.4'
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: '1.17.1'
          terraform_wrapper: false
      - name: Test fixed contracts
        run: go test ./...
      - name: Regenerate and compare Terraform snapshots
        run: go run ./cmd/golden -check
