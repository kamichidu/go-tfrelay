name: Golden Set

on:
  pull_request:
    branches: [main, feat/cli-flagshim-migration]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  golden:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.4'
      - name: Test fixed contracts
        run: go test ./...
      - name: Compare fixed Terraform show JSON snapshots
        run: go run ./cmd/golden -check
