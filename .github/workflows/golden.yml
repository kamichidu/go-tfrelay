name: Golden Set

on:
  pull_request:
    branches: [main, feat/xlsx-sink-module-impl]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  golden:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.4'
      - name: Test fixed contracts
        run: go test ./...
      - name: Verify RelayData compatibility schema and harness
        run: go test ./cmd/relay-compat
      - name: Test independent XLSX sink module
        working-directory: plugins/sink-xlsx
        run: go test ./...
      - name: Verify XLSX module without repository workspace
        run: |
          GOWORK=off go -C plugins/sink-xlsx test ./...
          GOWORK=off go -C plugins/sink-xlsx install ./cmd/tfrelay-sink-xlsx
      - name: Check canonical compatibility goldens
        run: |
          go build -o /tmp/tfrelay-transform-groupby ./cmd/tfrelay-transform-groupby
          go run ./cmd/relay-compat -schema schema/v1/relaydata.schema.json -fixtures testdata/compat/v1 -stage transform /tmp/tfrelay-transform-groupby
      - name: Check XLSX sink behavior through its artifact
        run: GOWORK=off go -C plugins/sink-xlsx test ./internal/contracttest
      - name: Compare fixed Terraform show JSON snapshots
        run: go run ./cmd/golden -check
