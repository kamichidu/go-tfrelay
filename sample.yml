---
plugins:
  source:
    # automatic terraform-plan execution
    - command: tfrelay-source-planfile
      args: [--, terraform, plan]
  transform:
    # grouping resources by resource.type
    - command: tfrelay-transform-groupby
  sink:
    # generate asciidoc
    - command: tfrelay-sink-text
      env:
        TFRELAY_SINK_TEXT_OUTPUT: _dist/index.adoc
        TFRELAY_SINK_TEXT_TEMPLATE: |
          {{define "__not_found__" -}}
          == {{$.Type}}

          [%autowidth]
          |===
          {{$keys := unionKeys $.Instances -}}
          {{range $header := $keys}}| {{$header}} {{end}}

          {{range $instance := $.Instances -}}
          {{range $col := extractColumns $instance $keys -}}
          | {{$col}}
          {{end}}
          {{end -}}
          |===
          {{end -}}

          {{range $resource := $.Resources -}}
          {{evalTemplate $resource.Type $resource}}
          {{end -}}
